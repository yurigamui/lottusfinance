name: verificacao-e-seguranca

on:
  push:
  pull_request:
  schedule:
    - cron: '17 9 * * 1'   # toda segunda-feira, para pegar vulnerabilidades novas

permissions:
  contents: read

jobs:
  verificacao:
    name: Verificação do repositório
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Sintaxe, links locais, CSP e segredos
        run: node scripts/check.mjs --warn
      - name: Auditoria de dependências npm
        run: npm audit --audit-level=high

  banco-local:
    name: Migrações em Postgres local
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Aplica supabase/migrations num Postgres descartável e roda supabase/tests
        run: scripts/test-db.sh

  segredos:
    name: Varredura de segredos (histórico completo)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Gitleaks (binário oficial, gratuito)
        env:
          GITLEAKS_VERSION: 8.21.2
        run: |
          curl -sSfL "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" | tar -xz gitleaks
          ./gitleaks git --redact --no-banner --config .gitleaks.toml --exit-code 1 .
