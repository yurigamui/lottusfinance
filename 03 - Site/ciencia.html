<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Notificação de cessão · Lottus</title>
<meta name="robots" content="noindex, nofollow">
<meta name="color-scheme" content="light">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap">
<link rel="icon" type="image/png" href="img/mark-rosa.png">
<style>
  :root { --tinta: #231c1a; --tinta-2: #4a403b; --muted: #8a7d74; --papel: #f5f2eb; --card: #fffdf9; --linha: #e6dccf; --rosa: #c73053; --rosa-tint: #fdf0f3; }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--papel); color: var(--tinta); font-family: Inter, Helvetica, Arial, sans-serif; -webkit-font-smoothing: antialiased; }
  .wrap { max-width: 620px; margin: 0 auto; padding: 28px 16px 48px; }
  .top { display: flex; justify-content: space-between; align-items: center; margin-bottom: 18px; }
  .top img { height: 30px; }
  .card { background: var(--card); border: 1px solid var(--linha); border-radius: 20px; padding: 26px 24px; }
  .eyebrow { font-size: 12px; letter-spacing: 0.07em; text-transform: uppercase; color: var(--muted); font-weight: 700; }
  h1 { font-size: 23px; line-height: 1.3; letter-spacing: -0.02em; margin: 8px 0 14px; }
  p { font-size: 15px; line-height: 1.6; color: var(--tinta-2); margin: 0 0 12px; }
  table { width: 100%; border-collapse: collapse; margin: 8px 0 4px; font-size: 14px; }
  th { text-align: left; font-size: 11px; text-transform: uppercase; letter-spacing: 0.05em; color: var(--muted); padding: 6px 6px; }
  td { padding: 10px 6px; border-top: 1px solid #efe7dc; }
  .num { text-align: right; white-space: nowrap; }
  .pay { margin-top: 16px; padding: 14px 16px; border-radius: 14px; background: var(--rosa-tint); border: 1px solid #f3cbd5; font-size: 14px; line-height: 1.55; color: var(--tinta-2); }
  .pay b { color: var(--tinta); }
  .ack { margin-top: 22px; display: grid; gap: 10px; }
  label { font-size: 13px; font-weight: 600; color: var(--tinta-2); }
  input { width: 100%; height: 48px; border-radius: 12px; border: 1px solid var(--linha); background: #fff; padding: 0 14px; font: inherit; font-size: 15px; }
  input:focus { outline: 3px solid #f6d3dc; border-color: var(--rosa); }
  button { height: 50px; border: 0; border-radius: 999px; background: var(--tinta); color: #fff; font: inherit; font-weight: 700; font-size: 15px; cursor: pointer; }
  button:disabled { opacity: 0.6; cursor: default; }
  .done { display: flex; gap: 12px; align-items: flex-start; padding: 14px 16px; border-radius: 14px; background: #e3f1ea; color: #2f6b4f; font-size: 14.5px; line-height: 1.5; margin-top: 18px; }
  .done b { color: #1f5139; }
  .muted { color: var(--muted); font-size: 12.5px; line-height: 1.5; }
  .err { padding: 14px 16px; border-radius: 14px; background: #f7e1df; color: #9b2c22; font-size: 14.5px; }
  .mkt { margin-top: 18px; background: var(--tinta); border-radius: 20px; padding: 24px; color: #c9bdb4; }
  .mkt .eyebrow { color: #e8708b; }
  .mkt h2 { color: #f5f0e8; font-size: 20px; margin: 8px 0; letter-spacing: -0.02em; }
  .mkt p { color: #c9bdb4; }
  .mkt a { display: inline-block; margin-top: 6px; background: var(--rosa); color: #fff; text-decoration: none; font-weight: 700; font-size: 14px; padding: 11px 20px; border-radius: 999px; }
  .spinner { width: 28px; height: 28px; border-radius: 50%; border: 3px solid var(--linha); border-top-color: var(--rosa); animation: s 0.8s linear infinite; margin: 24px auto; }
  @keyframes s { to { transform: rotate(360deg); } }
</style>
</head>
<body>
<div class="wrap">
  <div class="top"><a href="index.html"><img src="img/logo-rosa.png" alt="Lottus"></a><span class="muted">Notificação de cessão</span></div>
  <div class="card" id="box"><div class="spinner" aria-label="Carregando"></div></div>
  <div class="mkt">
    <div class="eyebrow">Conheça a Lottus</div>
    <h2>Sua empresa também vende a prazo?</h2>
    <p>Com a Lottus, você antecipa o valor das suas notas fiscais pelo celular, sem burocracia. O custo aparece na tela antes de assinar, e o dinheiro cai na conta da sua empresa.</p>
    <a href="index.html?utm_source=ciencia_cessao&amp;utm_medium=web&amp;utm_campaign=sacados">Saiba como funciona</a>
  </div>
</div>
<script>
(function () {
  // Projeto Supabase da Lottus (chave publicável: pode ficar no site)
  var FN = 'https://rowhslnnlzfbhmzbylbz.supabase.co/functions/v1/cession-ack';
  var KEY = 'sb_publishable_G_2ClQ5DpzaAn_02yahsfQ_FwSFR5eQ';
  var box = document.getElementById('box');
  var token = new URLSearchParams(location.search).get('t') || '';
  var esc = function (s) { return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); };
  var brl = function (v) { return Number(v || 0).toLocaleString('pt-BR', { style: 'currency', currency: 'BRL' }); };
  var date = function (v) { if (!v) return '—'; var p = String(v).slice(0, 10).split('-'); return p[2] + '/' + p[1] + '/' + p[0]; };
  var dt = function (v) { return new Date(v).toLocaleString('pt-BR', { dateStyle: 'short', timeStyle: 'short' }); };
  var doc = function (v) { var s = String(v || ''); return s.length === 14 ? s.replace(/(\d{2})(\d{3})(\d{3})(\d{4})(\d{2})/, '$1.$2.$3/$4-$5') : s; };
  function call(body) {
    return fetch(FN, { method: 'POST', headers: { 'Content-Type': 'application/json', apikey: KEY, Authorization: 'Bearer ' + KEY }, body: JSON.stringify(body) })
      .then(function (r) { return r.json().then(function (j) { if (!r.ok) throw new Error(j.error || 'erro'); return j; }); });
  }
  function fail(msg) { box.innerHTML = '<div class="err">' + esc(msg) + '</div><p class="muted" style="margin-top:12px">Se precisar, escreva para contato@lottusfinance.com.br.</p>'; }
  if (!/^[0-9a-f]{64}$/.test(token)) return fail('Este link não é válido. Abra o botão do e-mail mais recente que você recebeu.');
  call({ action: 'view', token: token }).then(function (n) {
    var text = String(n.text || '').split(/\n{2,}/).filter(function (b) { return b && b.indexOf('# ') !== 0; })
      .map(function (b) { return '<p>' + esc(b).replace(/\n/g, '<br>') + '</p>'; }).join('');
    var rows = (n.items || []).map(function (x) {
      return '<tr><td>NF-e ' + esc(x.nfe || '—') + ' · parc. ' + esc(x.installment || '') + '</td><td>' + date(x.due_date) + '</td><td class="num"><b>' + brl(x.amount) + '</b></td></tr>';
    }).join('');
    box.innerHTML =
      '<div class="eyebrow">Notificação de cessão de crédito</div>' +
      '<h1>' + esc(n.assignor && n.assignor.name) + ' cedeu duplicatas emitidas contra a sua empresa</h1>' + text +
      '<table><thead><tr><th>Duplicata</th><th>Vencimento</th><th class="num">Valor</th></tr></thead><tbody>' + rows +
      '<tr><td colspan="2"><b>Total</b></td><td class="num"><b>' + brl(n.total) + '</b></td></tr></tbody></table>' +
      '<div class="pay"><b>Confira sempre o beneficiário dos boletos:</b> ' + esc(n.beneficiary && n.beneficiary.name) + ', CNPJ ' + esc(doc(n.beneficiary && n.beneficiary.document)) +
      '. Não pague boletos com outro beneficiário nem faça depósitos para o Cedente referentes a estas duplicatas.</div>' +
      '<div id="ack"></div><p class="muted" style="margin-top:16px">Código da notificação: ' + esc(n.code) + '</p>';
    var ack = document.getElementById('ack');
    var paintDone = function (at, name) {
      ack.innerHTML = '<div class="done"><span aria-hidden="true">✓</span><div><b>Recebimento confirmado</b><br>' + (name ? esc(name) + ', em ' : 'Em ') + dt(at) + '. Obrigado!</div></div>';
    };
    if (n.acknowledged_at) return paintDone(n.acknowledged_at, n.ack_name);
    ack.innerHTML = '<form class="ack" id="f"><label for="nm">Seu nome (opcional)</label><input id="nm" autocomplete="name" placeholder="Quem está confirmando">' +
      '<button type="submit">Confirmar recebimento</button><span class="muted">Ao confirmar, você declara que recebeu esta notificação. Isso não altera valores nem vencimentos.</span></form>';
    document.getElementById('f').onsubmit = function (e) {
      e.preventDefault();
      var b = this.querySelector('button'); b.disabled = true; b.textContent = 'Confirmando…';
      call({ action: 'confirm', token: token, name: document.getElementById('nm').value }).then(function (r) { paintDone(r.acknowledged_at, r.ack_name); })
        .catch(function () { b.disabled = false; b.textContent = 'Confirmar recebimento'; alert('Não deu certo agora. Tente de novo em instantes.'); });
    };
  }).catch(function (e) { fail(e.message === 'not_found' ? 'Este link não vale mais. Use o botão do e-mail mais recente que você recebeu.' : 'Não conseguimos abrir a notificação agora. Tente de novo em instantes.'); });
})();
</script>
</body>
</html>
