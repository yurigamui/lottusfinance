<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lottus Admin | Login Restrito</title>
    
    <link rel="icon" type="image/x-icon" href="assets/img/Favicon.png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    
    <style>
        /* ==========================================
           SISTEMA DE CORES E DESIGN TOKENS
           ========================================== */
        :root {
            --lottus-beige: #F4F1EA;
            --lottus-pink: #C82A60; 
            --lottus-pink-hover: #A01F4A;
            --lottus-white: #FFFFFF;
            --lottus-graphite: #212529; 
            --lottus-graphite-light: #555555;
            --lottus-border: #E5E0D8;
            --lottus-success: #2B8A3E;
            --lottus-error: #C92A2A;
            
            --border-radius-sm: 8px;
            --border-radius-md: 16px;
            --border-radius-lg: 24px;
            --border-radius-pill: 50px;
            
            --transition-fast: 0.2s cubic-bezier(0.4, 0, 0.2, 1);
            --shadow-md: 0 12px 40px rgba(33, 37, 41, 0.08);
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }
        
        body, html { 
            font-family: 'Inter', sans-serif; 
            background-color: var(--lottus-beige); 
            color: var(--lottus-graphite); 
            display: flex; 
            height: 100vh; 
            width: 100vw; 
            align-items: center; 
            justify-content: center;
            -webkit-font-smoothing: antialiased;
        }

        /* TOAST ALERT */
        .toast-alert { position: fixed; top: 24px; right: 24px; padding: 16px 24px; background: var(--lottus-white); border-left: 4px solid var(--lottus-pink); border-radius: 8px; box-shadow: var(--shadow-md); z-index: 10000; transform: translateX(150%); transition: transform 0.3s ease; display: flex; align-items: center; gap: 12px; font-weight: 600; font-size: 0.95rem; }
        .toast-alert.show { transform: translateX(0); }
        .toast-alert.error { border-left-color: #C92A2A; color: #C92A2A; }
        .toast-alert.success { border-left-color: #2B8A3E; color: #2B8A3E; }

        /* SPINNER */
        .spinner { width: 20px; height: 20px; border: 3px solid rgba(255, 255, 255, 0.3); border-top-color: var(--lottus-white); border-radius: 50%; animation: spin 1s linear infinite; margin: 0; }
        @keyframes spin { 100% { transform: rotate(360deg); } }

        /* CONTAINER LOGIN */
        .login-card {
            background-color: var(--lottus-white);
            border-radius: var(--border-radius-lg);
            padding: 48px;
            width: 100%;
            max-width: 440px;
            box-shadow: var(--shadow-md);
            border: 1px solid var(--lottus-border);
            animation: fadeIn 0.4s cubic-bezier(0.16, 1, 0.3, 1) forwards;
            display: flex;
            flex-direction: column;
        }

        @keyframes fadeIn { from { opacity: 0; transform: translateY(15px); } to { opacity: 1; transform: translateY(0); } }

        .login-header {
            text-align: center;
            margin-bottom: 32px;
        }

        .login-header img {
            max-height: 36px;
            margin-bottom: 16px;
        }

        .admin-badge {
            background: var(--lottus-graphite);
            color: var(--lottus-white);
            font-size: 0.7rem;
            font-weight: 800;
            padding: 4px 10px;
            border-radius: var(--border-radius-pill);
            display: inline-block;
            letter-spacing: 0.05em;
            margin-bottom: 8px;
        }

        .login-header h1 {
            font-size: 1.5rem;
            font-weight: 700;
            color: var(--lottus-graphite);
            margin: 0 0 8px 0;
            letter-spacing: -0.02em;
        }

        .login-header p {
            font-size: 0.95rem;
            color: var(--lottus-graphite-light);
            margin: 0;
        }

        /* FORMULÁRIO */
        .input-group { display: flex; flex-direction: column; gap: 6px; margin-bottom: 20px; position: relative; }
        .label-row { display: flex; justify-content: space-between; align-items: baseline; }
        .input-group label { font-size: 0.85rem; font-weight: 600; color: var(--lottus-graphite); }
        
        .input-wrapper { position: relative; display: flex; align-items: center; }
        .input-wrapper input { width: 100%; padding: 14px 16px; border: 1.5px solid #E2E8F0; border-radius: 8px; font-family: 'Inter', sans-serif; font-size: 0.95rem; color: var(--lottus-graphite); background-color: #F8FAFC; transition: all var(--transition-fast); outline: none; }
        .input-wrapper input:focus { border-color: var(--lottus-pink); background-color: var(--lottus-white); box-shadow: 0 0 0 3px rgba(200, 42, 96, 0.1); }
        
        .pwd-toggle { position: absolute; right: 16px; background: none; border: none; color: var(--lottus-graphite-light); cursor: pointer; padding: 0; display: flex; align-items: center; }
        .pwd-toggle:hover { color: var(--lottus-pink); }

        .forgot-pwd { font-size: 0.8rem; color: var(--lottus-graphite-light); text-decoration: none; font-weight: 500; transition: color var(--transition-fast); }
        .forgot-pwd:hover { color: var(--lottus-pink); text-decoration: underline; }

        .btn-submit { width: 100%; padding: 14px 28px; background-color: var(--lottus-graphite); color: var(--lottus-white); border: none; border-radius: 8px; font-size: 1rem; font-weight: 600; cursor: pointer; transition: background-color var(--transition-fast); display: flex; align-items: center; justify-content: center; gap: 8px; margin-top: 12px; }
        .btn-submit:hover:not(:disabled) { background-color: #000000; transform: translateY(-1px); box-shadow: 0 6px 12px rgba(0,0,0,0.1); }
        .btn-submit:disabled { opacity: 0.7; cursor: not-allowed; }

        .security-notice { margin-top: 24px; text-align: center; font-size: 0.8rem; color: var(--lottus-graphite-light); display: flex; align-items: center; justify-content: center; gap: 6px; }
        .security-notice svg { color: var(--lottus-success); }

        @media (max-width: 480px) {
            .login-card { padding: 32px 24px; border-radius: 16px; border: none; box-shadow: none; background: transparent; }
            body { background: var(--lottus-white); }
        }
    </style>
</head>
<body>

    <!-- TOAST ALERT -->
    <div id="toast" class="toast-alert">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" id="toast-icon"></svg>
        <span id="toast-msg">Mensagem</span>
    </div>

    <!-- CARTÃO DE LOGIN -->
    <div class="login-card">
        <div class="login-header">
            <img src="assets/img/Logo 1.png" alt="Lottus Finance Logo">
            <div><span class="admin-badge">WORKSPACE ADMIN</span></div>
            <h1>Acesso Restrito</h1>
            <p>Entre com suas credenciais de administrador.</p>
        </div>

        <form id="form-login">
            <div class="input-group">
                <div class="label-row">
                    <label for="email">E-mail Corporativo</label>
                </div>
                <div class="input-wrapper">
                    <input type="email" id="email" placeholder="nome@lottusfinance.com.br" required autocomplete="email">
                </div>
            </div>

            <div class="input-group">
                <div class="label-row">
                    <label for="senha">Senha de Acesso</label>
                    <a href="#" class="forgot-pwd" onclick="alert('Funcionalidade de recuperação de senha em desenvolvimento.')">Esqueceu a senha?</a>
                </div>
                <div class="input-wrapper">
                    <input type="password" id="senha" placeholder="••••••••" required autocomplete="current-password">
                    <button type="button" class="pwd-toggle" onclick="togglePwd('senha')">
                        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path><circle cx="12" cy="12" r="3"></circle></svg>
                    </button>
                </div>
            </div>

            <button type="submit" class="btn-submit" id="btn-submit">
                Acessar Painel
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><line x1="5" y1="12" x2="19" y2="12"></line><polyline points="12 5 19 12 12 19"></polyline></svg>
            </button>
        </form>

        <div class="security-notice">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect><path d="M7 11V7a5 5 0 0 1 10 0v4"></path></svg>
            Ambiente monitorado e protegido
        </div>
    </div>

    <!-- Supabase SDK -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script>
        // Configurações do Supabase
        const supabaseUrl = 'https://rowhslnnlzfbhmzbylbz.supabase.co';
        const supabaseKey = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InJvd2hzbG5ubHpmYmhtemJ5bGJ6Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODQ4Mjg2MTgsImV4cCI6MjEwMDQwNDYxOH0.hUvOsj_Tpf1asd7Neh4tnlLg5Vc-amcLRfbcoZKYX-0';
        const supabaseClient = supabase.createClient(supabaseUrl, supabaseKey);

        // Sistema de Alertas
        function showToast(message, type = 'error') {
            const toast = document.getElementById('toast');
            const icon = document.getElementById('toast-icon');
            document.getElementById('toast-msg').innerText = message;
            toast.className = `toast-alert show ${type}`;
            
            if (type === 'error') {
                icon.innerHTML = '<circle cx="12" cy="12" r="10"></circle><line x1="12" y1="8" x2="12" y2="12"></line><line x1="12" y1="16" x2="12.01" y2="16"></line>';
            } else {
                icon.innerHTML = '<polyline points="20 6 9 17 4 12"></polyline>';
            }
            setTimeout(() => toast.classList.remove('show'), 4000);
        }

        // Mostrar/Ocultar Senha
        function togglePwd(id) {
            const input = document.getElementById(id);
            input.type = input.type === "password" ? "text" : "password";
        }

        // Função Central de Verificação de Administrador
        async function verifyAdminAndRedirect(userId) {
            const { data: userVinculo, error } = await supabaseClient
                .from('usuarios_empresa')
                .select('perfil')
                .eq('auth_user_id', userId)
                .maybeSingle();

            if (userVinculo && userVinculo.perfil === 'SUPER_ADMIN') {
                window.location.href = 'index.html'; // Redireciona para o Dashboard Admin
            } else {
                // Se for cliente comum tentando dar uma de esperto, desloga na hora
                await supabaseClient.auth.signOut();
                showToast('Acesso negado. Credenciais sem privilégios administrativos.', 'error');
            }
        }

        document.addEventListener('DOMContentLoaded', async () => {
            
            // 1. AUTO-LOGIN: Verifica se já existe alguém logado
            const { data: { session } } = await supabaseClient.auth.getSession();
            if (session) {
                // Se tem sessão, verifica silenciosamente se é admin
                await verifyAdminAndRedirect(session.user.id);
            }

            // 2. LÓGICA DO FORMULÁRIO DE LOGIN
            const form = document.getElementById('form-login');
            const btnSubmit = document.getElementById('btn-submit');

            form.addEventListener('submit', async (e) => {
                e.preventDefault();

                const email = document.getElementById('email').value.trim();
                const password = document.getElementById('senha').value;

                if (!email || !password) {
                    showToast('Por favor, preencha todos os campos.', 'error');
                    return;
                }

                // UI Loading
                const textoOriginal = btnSubmit.innerHTML;
                btnSubmit.innerHTML = `<div class="spinner"></div>`;
                btnSubmit.disabled = true;

                try {
                    // Tenta fazer o Login padrão no Supabase
                    const { data, error } = await supabaseClient.auth.signInWithPassword({
                        email: email,
                        password: password,
                    });

                    if (error) {
                        if (error.message.includes('Invalid login')) {
                            throw new Error('E-mail ou senha incorretos.');
                        }
                        throw error;
                    }

                    // Se a senha estiver certa, faz o "Door Check" (verificação da porta)
                    await verifyAdminAndRedirect(data.user.id);

                } catch (error) {
                    showToast(error.message, 'error');
                    btnSubmit.innerHTML = textoOriginal;
                    btnSubmit.disabled = false;
                }
            });
        });
    </script>
</body>
</html>
