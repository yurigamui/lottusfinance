<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lottus Finance | Cadastrar Nova Empresa</title>
    
    <link rel="stylesheet" href="../assets/css/style.css">
    <link rel="icon" type="image/x-icon" href="../assets/img/Favicon.png">
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    
    <style>
        body, html {
            background-color: var(--lottus-beige);
            margin: 0;
            padding: 0;
            min-height: 100vh;
            font-family: 'Inter', sans-serif;
            color: var(--lottus-graphite);
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .add-company-container {
            max-width: 580px;
            width: 100%;
            padding: 24px;
            box-sizing: border-box;
        }

        .back-link {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            color: var(--lottus-graphite-light);
            text-decoration: none;
            font-weight: 600;
            font-size: 0.9rem;
            margin-bottom: 24px;
            transition: color var(--transition-fast);
        }

        .back-link:hover {
            color: var(--lottus-graphite);
        }

        .form-card {
            background-color: var(--lottus-white);
            border-radius: var(--border-radius-lg);
            padding: 40px;
            box-shadow: 0 12px 40px rgba(33, 37, 41, 0.06);
            border: 1px solid var(--lottus-border);
            box-sizing: border-box;
        }

        .form-header h2 {
            font-size: 1.5rem;
            font-weight: 700;
            margin: 0 0 8px 0;
            color: var(--lottus-graphite);
        }

        .form-header p {
            color: var(--lottus-graphite-light);
            font-size: 0.95rem;
            margin: 0 0 32px 0;
            line-height: 1.5;
        }

        .form-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
        }

        .full-width {
            grid-column: span 2;
        }

        .input-group {
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .input-group label {
            font-size: 0.85rem;
            font-weight: 600;
            color: var(--lottus-graphite);
        }

        .input-group input, .input-group select {
            padding: 14px 16px;
            border: 1.5px solid #E2E8F0;
            border-radius: 8px;
            font-family: 'Inter', sans-serif;
            font-size: 0.95rem;
            color: var(--lottus-graphite);
            background-color: #F8FAFC;
            transition: all var(--transition-fast);
            outline: none;
        }

        .input-group input:focus, .input-group select:focus {
            border-color: var(--lottus-pink);
            background-color: var(--lottus-white);
            box-shadow: 0 0 0 3px rgba(200, 42, 96, 0.1);
        }

        .input-group input.has-error {
            border-color: #E63946;
            background-color: #FFF0F1;
        }

        .error-msg {
            color: #E63946;
            font-size: 0.78rem;
            font-weight: 500;
            display: none;
        }

        .btn-submit-company {
            width: 100%;
            padding: 14px;
            background-color: var(--lottus-pink);
            color: var(--lottus-white);
            border: none;
            border-radius: 8px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: background-color var(--transition-fast);
            margin-top: 12px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }

        .btn-submit-company:hover {
            background-color: var(--lottus-pink-hover);
        }

        @media(max-width: 600px) {
            .form-grid { grid-template-columns: 1fr; }
            .full-width { grid-column: span 1; }
            .form-card { padding: 24px; }
        }
    </style>
</head>
<body>

    <div class="add-company-container">
        
        <a href="index.html" class="back-link">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="19" y1="12" x2="5" y2="12"></line><polyline points="12 19 5 12 12 5"></polyline></svg>
            Voltar ao Dashboard
        </a>

        <div class="form-card">
            <div class="form-header">
                <h2>Adicionar Novo CNPJ</h2>
                <p>Vincule outra empresa à sua conta para gerenciar antecipações e limites no mesmo painel.</p>
            </div>

            <form id="add-company-form" novalidate>
                <div class="form-grid">
                    
                    <div class="input-group full-width">
                        <label for="cnpj">CNPJ da Empresa</label>
                        <input type="text" id="cnpj" name="cnpj" placeholder="00.000.000/0001-00" maxlength="18" required>
                        <span class="error-msg" id="cnpj-error">Informe um CNPJ válido.</span>
                    </div>

                    <div class="input-group full-width">
                        <label for="razao">Razão Social</label>
                        <input type="text" id="razao" name="razao" placeholder="Razão social registrada na Receita" required>
                    </div>

                    <div class="input-group">
                        <label for="cargo">Seu Cargo nesta Empresa</label>
                        <input type="text" id="cargo" name="cargo" placeholder="Ex: Sócio, Diretor..." required>
                    </div>

                    <div class="input-group">
                        <label for="faturamento">Faturamento Anual</label>
                        <select id="faturamento" name="faturamento" required>
                            <option value="" disabled selected>Selecione</option>
                            <option value="ate_4m">Até R$ 4,8M</option>
                            <option value="4m_a_16m">R$ 4,8M a R$ 16M</option>
                            <option value="16m_a_50m">R$ 16M a R$ 50M</option>
                            <option value="acima_50m">Acima de R$ 50M</option>
                        </select>
                    </div>

                    <div class="input-group full-width">
                        <button type="submit" class="btn-submit-company" id="btn-submit">
                            Cadastrar Empresa e Continuar
                        </button>
                    </div>

                </div>
            </form>
        </div>

    </div>

    <!-- Supabase CDN -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <script>
        const supabaseUrl = 'https://rowhslnnlzfbhmzbylbz.supabase.co';
        const supabaseKey = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InJvd2hzbG5ubHpmYmhtemJ5bGJ6Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODQ4Mjg2MTgsImV4cCI6MjEwMDQwNDYxOH0.hUvOsj_Tpf1asd7Neh4tnlLg5Vc-amcLRfbcoZKYX-0';
        const supabaseClient = supabase.createClient(supabaseUrl, supabaseKey);

        document.addEventListener('DOMContentLoaded', async () => {
            
            // 1. VERIFICA SE O USUÁRIO ESTÁ LOGADO
            const { data: { session }, error: sessionErr } = await supabaseClient.auth.getSession();
            if (!session || sessionErr) {
                window.location.href = '../login/index.html';
                return;
            }

            const authUser = session.user;
            const cnpjInput = document.getElementById('cnpj');
            const cnpjError = document.getElementById('cnpj-error');
            const form = document.getElementById('add-company-form');
            const btnSubmit = document.getElementById('btn-submit');

            // MÁSCARA CNPJ
            cnpjInput.addEventListener('input', (e) => {
                let v = e.target.value.replace(/\D/g, "");
                if (v.length > 14) v = v.substring(0, 14);
                v = v.replace(/^(\d{2})(\d)/, "$1.$2");
                v = v.replace(/^(\d{2})\.(\d{3})(\d)/, "$1.$2.$3");
                v = v.replace(/\.(\d{3})(\d)/, ".$1/$2");
                v = v.replace(/(\d{4})(\d)/, "$1-$2");
                e.target.value = v;
                cnpjInput.classList.remove('has-error');
                cnpjError.style.display = 'none';
            });

            form.addEventListener('submit', async (e) => {
                e.preventDefault();

                const cnpjLimpo = cnpjInput.value.replace(/\D/g, "");
                const razao = document.getElementById('razao').value.trim();
                const cargo = document.getElementById('cargo').value.trim();

                if (cnpjLimpo.length !== 14 || !razao || !cargo) {
                    alert("Por favor, preencha todos os campos corretamente.");
                    return;
                }

                btnSubmit.disabled = true;
                btnSubmit.innerText = "Cadastrando...";

                try {
                    // 2. VALIDA SE O CNPJ JÁ EXISTE NA TABELA EMPRESAS
                    const { data: empresaExistente } = await supabaseClient
                        .from('empresas')
                        .select('id')
                        .eq('cnpj', cnpjLimpo)
                        .maybeSingle();

                    let empresaId = null;

                    if (empresaExistente) {
                        // CNPJ já cadastrado: verifica se o usuário já tem vínculo
                        const { data: vinculoExistente } = await supabaseClient
                            .from('usuarios_empresa')
                            .select('id')
                            .eq('auth_user_id', authUser.id)
                            .eq('empresa_id', empresaExistente.id)
                            .maybeSingle();

                        if (vinculoExistente) {
                            alert("Sua conta já possui vínculo com este CNPJ!");
                            window.location.href = 'index.html';
                            return;
                        }

                        cnpjInput.classList.add('has-error');
                        cnpjError.innerText = "Este CNPJ já está cadastrado na plataforma por outro gestor. Solicite acesso.";
                        cnpjError.style.display = 'block';
                        btnSubmit.disabled = false;
                        btnSubmit.innerText = "Cadastrar Empresa e Continuar";
                        return;
                    } else {
                        // 3. INSERE A NOVA EMPRESA NO BANCO
                        const { data: novaEmpresa, error: createEmpError } = await supabaseClient
                            .from('empresas')
                            .insert([{
                                cnpj: cnpjLimpo,
                                razao: razao,
                                nome: razao,
                                status: 'AGUARDANDO_DOCUMENTOS',
                                limite_total: 0
                            }])
                            .select()
                            .single();

                        if (createEmpError) throw createEmpError;
                        empresaId = novaEmpresa.id;
                    }

                    // 4. VINCULA O USUÁRIO LOGADO À NOVA EMPRESA
                    const userNome = authUser.user_metadata?.nome || authUser.email;
                    
                    const { error: vinculoErr } = await supabaseClient
                        .from('usuarios_empresa')
                        .insert([{
                            empresa_id: empresaId,
                            auth_user_id: authUser.id,
                            nome: userNome,
                            cargo: cargo,
                            email: authUser.email,
                            perfil: 'MASTER',
                            status: 'ATIVO'
                        }]);

                    if (vinculoErr) throw vinculoErr;

                    // SUCESSO! Redireciona direto para o Dashboard
                    alert("Empresa cadastrada com sucesso!");
                    window.location.href = 'index.html';

                } catch (err) {
                    console.error("Erro ao adicionar empresa:", err);
                    alert("Ocorreu um erro ao cadastrar a empresa. Tente novamente.");
                    btnSubmit.disabled = false;
                    btnSubmit.innerText = "Cadastrar Empresa e Continuar";
                }
            });
        });
    </script>
</body>
</html>
