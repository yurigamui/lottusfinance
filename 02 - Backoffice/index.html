<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="robots" content="noindex, nofollow" />
  <title>Lottus · Backoffice</title>
  <link rel="icon" type="image/png" href="img/mark-rosa.png">
  <link rel="preconnect" href="https://fonts.googleapis.com" />

  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="styles.css" />
  <script>
    /* Tema antes de desenhar a página: claro (padrão), escuro ou do sistema */
    try { document.documentElement.dataset.theme = localStorage.getItem('lottus.bo.theme') || 'light'; }
    catch (e) { document.documentElement.dataset.theme = 'light'; }
  </script>
</head>
<body>

  <div id="modal-root"></div>
  <div id="toast-root" aria-live="assertive"></div>

  <script src="js/people.js"></script>

</html>
